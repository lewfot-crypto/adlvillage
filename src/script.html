var SCENE_THEME={inn1:'inn',attic:'attic',tavern:'tavern',school:'school',plaza:'plaza',shop:'shop'};
function buildTheme(th){
  if(th.bars)return th.bars;
  var R=rng(th.seed),bars=[],prev=3,b,i,ev,ch,rh,steps,pool=th.scale;
  for(b=0;b<8;b++){
    ch=CH[th.prog[b]];ev=[];
    /* 베이스 */
    if(th.bass==='oompah'){ev.push({s:0,k:'bass',m:ch.r,d:1,v:.5});ev.push({s:4,k:'bass',m:ch.r+7,d:1,v:.42});ev.push({s:2,k:'stab',m:[ch.t[0],ch.t[1],ch.t[2]],d:1,v:.1});ev.push({s:6,k:'stab',m:[ch.t[0],ch.t[1],ch.t[2]],d:1,v:.1})}
    else{ev.push({s:0,k:'bass',m:ch.r,d:4,v:.5});ev.push({s:4,k:'bass',m:ch.r+7,d:4,v:.36})}
    /* 패드 */
    if(th.pad)ch.t.slice(0,3).forEach(function(m){ev.push({s:0,k:'pad',m:m-12,d:8,v:th.pad})});
    /* 아르페지오 */
    if(th.arpVel)th.arpPat.forEach(function(ix,s){if(ix>=0)ev.push({s:s,k:'bell',m:ch.t[ix%4]+12,d:2,v:th.arpVel})});
    /* 멜로디 */
    if(th.rest.indexOf(b)<0||b===7){
      rh=th.rhythms[Math.floor(R()*th.rhythms.length)].slice();
      if(b===7||b===3){rh=[1,0,0,0,0,0,0,0]}
      steps=[];for(i=0;i<8;i++)if(rh[i])steps.push(i);
      steps.forEach(function(s,n){
        var nextS=steps[n+1]!==undefined?steps[n+1]:8,idx;
        if(n===0||b===7||b===3){
          /* 강박은 화음 음 중 가까운 것 */
          var best=0,bd=99;pool.forEach(function(m,j){var near=ch.t.some(function(c){return (m-c)%12===0});var d=Math.abs(j-prev)+(near?0:3);if(d<bd){bd=d;best=j}});idx=best;
        }else{
          var mv=[-2,-1,-1,0,1,1,2][Math.floor(R()*7)];idx=Math.max(0,Math.min(pool.length-1,prev+mv));
        }
        prev=idx;
        ev.push({s:s,k:th.mel,m:pool[idx],d:(b===7||b===3)?8:(nextS-s),v:th.melVel});
      });
    }
    bars.push(ev);
  }
  th.bars=bars;return bars;
}
function noteOn(ctx,out,k,t,m,durSec,v){
  var g=ctx.createGain(),o,o2,f,fr=mtof(m);
  g.connect(out);
  if(k==='bell'){
    o=ctx.createOscillator();o.type='sine';o.frequency.value=fr;
    o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=fr*3;var g2=ctx.createGain();g2.gain.value=.12;
    o.connect(g);o2.connect(g2);g2.connect(g);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.7,durSec*1.3));
    o.start(t);o2.start(t);o.stop(t+Math.max(.8,durSec*1.4));o2.stop(t+Math.max(.8,durSec*1.4));
  }else if(k==='pluck'||k==='stab'){
    o=ctx.createOscillator();o.type='triangle';o.frequency.value=fr;
    o2=ctx.createOscillator();o2.type='square';o2.frequency.value=fr;var g3=ctx.createGain();g3.gain.value=.18;
    f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(2600,t);f.frequency.exponentialRampToValueAtTime(700,t+.3);
    o.connect(f);o2.connect(g3);g3.connect(f);f.connect(g);
    var dd=k==='stab'?.18:Math.min(.5,Math.max(.22,durSec*.8));
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dd);
    o.start(t);o2.start(t);o.stop(t+dd+.05);o2.stop(t+dd+.05);
  }else if(k==='bass'){
    o=ctx.createOscillator();o.type='triangle';o.frequency.value=fr;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+Math.min(1.4,durSec*.95));
    o.connect(g);o.start(t);o.stop(t+Math.min(1.5,durSec));
  }else if(k==='pad'){
    o=ctx.createOscillator();o.type='triangle';o.frequency.value=fr;o.detune.value=-6;
    o2=ctx.createOscillator();o2.type='triangle';o2.frequency.value=fr;o2.detune.value=7;
    f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
    o.connect(f);o2.connect(f);f.connect(g);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.9,durSec*.4));g.gain.setValueAtTime(v,t+durSec*.7);g.gain.linearRampToValueAtTime(.0001,t+durSec+.15);
    o.start(t);o2.start(t);o.stop(t+durSec+.2);o2.stop(t+durSec+.2);
  }
}
function schedBar(ctx,out,th,bi,t0){
  var step=60/th.bpm/2,bars=buildTheme(th);
  bars[bi%8].forEach(function(e){
    var ms=Array.isArray(e.m)?e.m:[e.m];
    ms.forEach(function(m){noteOn(ctx,out,e.k,t0+e.s*step,m,e.d*step,e.v)});
  });
}
function makeBus(ctx,dest){
  var master=ctx.createGain();master.gain.value=.9;
  var comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;
  master.connect(comp);comp.connect(dest||ctx.destination);
  var bgm=ctx.createGain(),sfx=ctx.createGain();bgm.connect(master);sfx.connect(master);
  var dl=ctx.createDelay(1),fb=ctx.createGain(),lp=ctx.createBiquadFilter(),wet=ctx.createGain();
  dl.delayTime.value=.34;fb.gain.value=.34;lp.type='lowpass';lp.frequency.value=2200;wet.gain.value=.38;
  bgm.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(wet);wet.connect(master);
  return {master:master,bgm:bgm,sfx:sfx};
}
function audApplyVol(){
  if(!AUD.bus)return;
  var m=SET.mute?0:1,c=AUD.ctx.currentTime;
  AUD.bus.bgm.gain.setTargetAtTime(m*(SET.bgmVol/100)*0.45,c,.05);
  AUD.bus.sfx.gain.setTargetAtTime(m*(SET.sfxVol/100)*0.65,c,.05);
}
function audInit(){
  if(AUD.ctx){if(AUD.ctx.state==='suspended')try{AUD.ctx.resume()}catch(_){}return}
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    AUD.ctx=new AC();AUD.bus=makeBus(AUD.ctx);
    var n=AUD.ctx.sampleRate,buf=AUD.ctx.createBuffer(1,n,n),d=buf.getChannelData(0),i;for(i=0;i<n;i++)d[i]=Math.random()*2-1;AUD.noise=buf;
    audApplyVol();
    if(AUD.name)playTheme(AUD.name,true);
  }catch(e){AUD.ctx=null}
}
function playTheme(name,force){
  if(name===AUD.name&&!force&&AUD.rt)return;
  AUD.name=name;
  if(!AUD.ctx||!THEMES[name])return;
  var ctx=AUD.ctx,old=AUD.rt;
  if(old){old.stop=true;try{old.g.gain.setTargetAtTime(0,ctx.currentTime,.25)}catch(_){}setTimeout(function(){try{old.g.disconnect()}catch(_){}},1800)}
  var g=ctx.createGain();g.gain.value=0;g.connect(AUD.bus.bgm);g.gain.setTargetAtTime(1,ctx.currentTime+.05,.4);
  var th=THEMES[name],rt={g:g,th:th,bar:0,next:ctx.currentTime+.2,stop:false};
  AUD.rt=rt;
  function tick(){
    if(rt.stop)return;
    var bd=60/th.bpm*4;
    while(rt.next<ctx.currentTime+1.6){schedBar(ctx,g,th,rt.bar,rt.next);rt.next+=bd;rt.bar++}
    setTimeout(tick,400);
  }
  tick();
}
/* 효과음 */
function env(ctx,out,t,a,peak,d){var g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);g.connect(out);return g}
function tone(type,f0,f1,t,dur,peak,out){
  var ctx=AUD.ctx,o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  var g=env(ctx,out||AUD.bus.sfx,t,.004,peak,dur);o.connect(g);o.start(t);o.stop(t+dur+.05);
}
function noiseHit(t,dur,fc,q,peak,type){
  var ctx=AUD.ctx,s=ctx.createBufferSource();s.buffer=AUD.noise;
  var f=ctx.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=fc;f.Q.value=q||1;
  var g=env(ctx,AUD.bus.sfx,t,.004,peak,dur);s.connect(f);f.connect(g);s.start(t,Math.random()*.5);s.stop(t+dur+.05);
}
var stepAlt=0;
var SFX={
  step:function(t){stepAlt^=1;noiseHit(t,.07,stepAlt?420:520,1.2,.16);tone('sine',stepAlt?95:110,60,t,.08,.12)},
  blip:function(t,p){tone('square',p||520,p?p*1.02:null,t,.04,.035)},
  select:function(t){tone('triangle',620,880,t,.07,.12)},
  whisper:function(t,f){f=f||440;tone('sine',f,f*1.01,t,.3,.2);tone('triangle',f*2,null,t,.2,.04)},
  confirm:function(t){tone('triangle',660,null,t,.09,.14);tone('triangle',990,null,t+.07,.14,.14)},
  tick:function(t){tone('triangle',900,700,t,.05,.1)},
  toast:function(t){tone('sine',1100,null,t,.12,.07);tone('sine',1650,null,t+.05,.16,.05)},
  doorOpen:function(t){
    var ctx=AUD.ctx,o=ctx.createOscillator(),f=ctx.createBiquadFilter(),lfo=ctx.createOscillator(),lg=ctx.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(150,t);o.frequency.linearRampToValueAtTime(230,t+.4);
    lfo.frequency.value=22;lg.gain.value=9;lfo.connect(lg);lg.connect(o.frequency);
    f.type='lowpass';f.frequency.value=700;f.Q.value=3;
    var g=env(ctx,AUD.bus.sfx,t,.05,.07,.45);o.connect(f);f.connect(g);o.start(t);lfo.start(t);o.stop(t+.5);lfo.stop(t+.5);
    noiseHit(t,.04,2400,3,.08)
  },
  doorClose:function(t){tone('sine',130,50,t,.16,.3);noiseHit(t,.06,900,1,.14);tone('triangle',420,300,t+.01,.05,.06)},
  whoosh:function(t){noiseHit(t,.5,700,.6,.12);},
  key:function(t){[784,988,1175,1568].forEach(function(f,i){tone('triangle',f,null,t+i*.08,.22,.11)})},
  sleep:function(t){[784,659,523,392].forEach(function(f,i){tone('sine',f,null,t+i*.35,.9,.1)})}
};
function sfx(name,a){
  if(!AUD.ctx||SET.mute||!SFX[name])return;
  if(AUD.ctx.state==='suspended')return;
  try{SFX[name](AUD.ctx.currentTime+.005,a)}catch(_){}
}

function loadSettings(){
  var saved={};try{saved=JSON.parse(localStorage.getItem(SKEY)||'{}')||{}}catch(_){}
  SETTINGS.forEach(function(s){if(s.def!==undefined)SET[s.id]=(saved[s.id]!==undefined&&typeof saved[s.id]===typeof s.def)?saved[s.id]:s.def});
}
function saveSettings(){try{localStorage.setItem(SKEY,JSON.stringify(SET))}catch(_){}}
function applyAll(){SETTINGS.forEach(function(s){if(s.apply)try{s.apply(SET[s.id])}catch(_){}})}
function setVal(id,v){
  SET[id]=v;saveSettings();
  var s=SETTINGS.filter(function(x){return x.id===id})[0];if(s&&s.apply)s.apply(v);
}
var setEl=document.getElementById('set'),setTabs=document.getElementById('settabs'),setBody=document.getElementById('setbody'),curTab=null,armed=null;
function tabsList(){var a=[];SETTINGS.forEach(function(s){if(a.indexOf(s.tab)<0)a.push(s.tab)});return a}
function mkBtn(txt,sel,fn){var b=document.createElement('button');b.type='button';b.className='pbtn'+(sel?' sel':'');b.textContent=txt;b.addEventListener('click',function(e){e.stopPropagation();fn()});return b}
function renderSettings(){
  if(smode){renderShop();return}
  if(jmode){renderJournal();return}
  setEl.querySelector('.sh b').textContent='설정';
  var tabs=tabsList();if(!curTab||tabs.indexOf(curTab)<0)curTab=tabs[0];
  setTabs.innerHTML='';
  tabs.forEach(function(t){setTabs.appendChild(mkBtn(t,t===curTab,function(){curTab=t;armed=null;sfx('select');renderSettings()}))});
  setBody.innerHTML='';
  SETTINGS.filter(function(s){return s.tab===curTab}).forEach(function(s){
    var row=document.createElement('div');
    if(s.type==='note'){row.className='note';row.textContent=s.label;setBody.appendChild(row);return}
    row.className='row';
    var lb=document.createElement('div');lb.className='lb';lb.textContent=s.label;
    if(s.hint){var sm=document.createElement('small');sm.textContent=s.hint;lb.appendChild(sm)}
    var ctl=document.createElement('div');ctl.className='ctl';
    if(s.type==='toggle'){
      ctl.appendChild(mkBtn(SET[s.id]?'켜짐':'꺼짐',!!SET[s.id],function(){setVal(s.id,!SET[s.id]);sfx('select');renderSettings()}));
    }else if(s.type==='select'){
      s.options.forEach(function(o){ctl.appendChild(mkBtn(o.l,SET[s.id]===o.v,function(){setVal(s.id,o.v);sfx('select');renderSettings()}))});
    }else if(s.type==='range'){
      var r=document.createElement('input');r.type='range';r.min=s.min;r.max=s.max;r.step=s.step;r.value=SET[s.id];
      var rv=document.createElement('span');rv.className='rv';rv.textContent=SET[s.id];
      r.addEventListener('input',function(){setVal(s.id,+r.value);rv.textContent=r.value});
      r.addEventListener('change',function(){if(s.preview)s.preview()});
      ctl.appendChild(r);ctl.appendChild(rv);
    }else if(s.type==='button'){
      var armedNow=armed===s.id;
      ctl.appendChild(mkBtn(armedNow?'정말요? 한 번 더':s.btn,armedNow,function(){
        if(s.confirm&&armed!==s.id){armed=s.id;sfx('tick');renderSettings();return}
        armed=null;sfx('confirm');s.run();
      }));
    }
    row.appendChild(lb);row.appendChild(ctl);setBody.appendChild(row);
  });
}
function openSettings(j,kind){
  if(state!=='play'&&state!=='title')return;jmode=!!j;smode=kind||null;
  prevState=state;state='menu';clearKeys();path=null;dest=null;pend=null;armed=null;
  renderSettings();setEl.hidden=false;sfx('confirm');
}
function closeSettings(){jmode=false;smode=null;setEl.hidden=true;if(state==='menu')state=(prevState==='title'?'title':'play');sfx('select')}

  function pop(){var top=hp[0],last=hp.pop();if(hp.length){hp[0]=last;var i=0,l,r,m;for(;;){l=2*i+1;r=l+1;m=i;if(l<hp.length&&hp[l][0]<hp[m][0])m=l;if(r<hp.length&&hp[r][0]<hp[m][0])m=r;if(m===i)break;var t1=hp[m];hp[m]=hp[i];hp[i]=t1;i=m}}return top}
  var s0=(sy*cols+sx)*5+4;dist[s0]=0;push(0,s0);
  var bestCell=-1,bd=1e12,bc=1e12;
  var cellBest=new Float32Array(N).fill(INF),cellState=new Int32Array(N).fill(-1);
  while(hp.length){
    var cur=pop(),cost=cur[0],st=cur[1];
    if(cost>dist[st])continue;
    var cell=(st/5)|0,dir=st-cell*5,cx0=cell%cols,cy0=(cell/cols)|0;
    if(cost<cellBest[cell]){cellBest[cell]=cost;cellState[cell]=st}
    for(var i=0;i<4;i++){
      var nx=cx0+ds[i][0],ny=cy0+ds[i][1];
      if(nx<0||ny<0||nx>=cols||ny>=rows||!isFree(nx,ny))continue;
      var nst=(ny*cols+nx)*5+i,nc=cost+1+((dir!==4&&dir!==i)?6:0);
      if(nc<dist[nst]){dist[nst]=nc;prev[nst]=st;push(nc,nst)}
    }
  }
  for(var c=0;c<N;c++){
    if(cellState[c]<0)continue;
    var ccx=(c%cols)*G+HW/2,ccy=((c/cols)|0)*G+HH/2,d,dx,dy;
    if(obj){dx=Math.max(obj.x-ccx,0,ccx-(obj.x+obj.w));dy=Math.max(obj.y-ccy,0,ccy-(obj.y+obj.h));d=Math.hypot(dx,dy)}
    else d=Math.hypot(ccx-tx,ccy-ty);
    if(d<bd-0.5||(Math.abs(d-bd)<=0.5&&cellBest[c]<bc)){bd=d;bc=cellBest[c];bestCell=c}
  }
  if(bestCell<0)return null;
  var seq=[],stt=cellState[bestCell];
  while(stt>=0){var cc=(stt/5)|0;seq.unshift({x:(cc%cols)*G,y:((cc/cols)|0)*G,d:stt-cc*5});stt=prev[stt]}
  /* 꺾이는 곳만 남기기 */
  var out=[];
  for(var j=0;j<seq.length;j++){
    var nxt=seq[j+1];
    if(!nxt||nxt.d!==seq[j].d)out.push({x:seq[j].x,y:seq[j].y});
  }
  /* 시작점(격자)까지 먼저 걸어가야 하므로 맨 앞에 시작칸 */
  if(out.length&&(out[0].x!==seq[0].x||out[0].y!==seq[0].y))out.unshift({x:seq[0].x,y:seq[0].y});
  if(out.length>1){var q0=out[0],q1=out[1];
    if((q0.x-px)*(q1.x-q0.x)+(q0.y-py)*(q1.y-q0.y)<0||Math.hypot(q0.x-px,q0.y-py)<2)out.shift();}
  return out;
}

function update(dt){

  if(e&&e.door){
    if(arrival){doorO-=dt*1.0;if(doorO<=0.12&&doorWas===false){doorWas=true;sfx('doorClose')}if(doorO<=0){doorO=0;arrival=false;doorWas=false;doorDir=1}}

      doorO+=(tgt-doorO)*Math.min(1,dt*5.5);if(Math.abs(tgt-doorO)<0.01)doorO=tgt;

    }
  }else{doorO=0}

    return;
  }

  if(state!=='play')return;
  var dx=dirv('right')-dirv('left'),dy=dirv('down')-dirv('up');

  else if(path&&path.length){
    var w=path[0],ddx=w.x-px,ddy=w.y-py;
    if(Math.abs(ddx)<1.5&&Math.abs(ddy)<1.5){px=w.x;py=w.y;path.shift();if(!path.length)arrive();checkExit();return}
    var step=SPD*dt,ax=(Math.abs(ddx)>=1.5&&(Math.abs(ddx)>=Math.abs(ddy)||Math.abs(ddy)<1.5))?'x':'y',mv=false;
    if(ax==='x'){var sx2=Math.sign(ddx)*Math.min(step,Math.abs(ddx));if(Math.abs(ddx)>=8||Math.abs(ddy)<1.5)face=ddx>0?'right':'left';if(!hit({x:px+sx2,y:py})){px+=sx2;mv=true}}
    else{var sy2=Math.sign(ddy)*Math.min(step,Math.abs(ddy));if(Math.abs(ddy)>=8||Math.abs(ddx)<1.5)face=ddy>0?'down':'up';if(!hit({x:px,y:py+sy2})){py+=sy2;mv=true}}

function cutUpdate(dt){
  if(!CUT)return;
  var st=CUT.cur;if(!st)return;
  CUT.t+=dt;
  if(st.wait!=null){if(CUT.t>=st.wait)cutAdvance();return}
  if(st.emote){if(CUT.t>=Math.min(1,st.wait||0.9)){cutAdvance()}return}
  if(st.scene){
    if(CUT.phase===0){cutFade+=dt*3;if(cutFade>=1){cutFade=1;cutSwitch(st);CUT.phase=1}}
    else{cutFade-=dt*3;if(cutFade<=0){cutFade=0;cutAdvance()}}
    return}
  if(st.walk){
    var tx=stepVal(st.x),ty=stepVal(st.y),sp=(st.speed||SPD)*dt,who=st.walk;
    var cx,cy,ddx,ddy;
    if(who==='player'){cx=px+HW/2;cy=py+HH}else{var a=actorObj(who);if(!a){cutAdvance();return}cx=a.x;cy=a.y;a.cover=null}
    ddx=tx-cx;ddy=ty-cy;
    if(Math.abs(ddx)<2&&Math.abs(ddy)<2){moving=false;cutWalkEnd(st);cutAdvance();return}
    if(st.diag){var dd=Math.sqrt(ddx*ddx+ddy*ddy),kk=Math.min(sp,dd)/dd,ux=ddx*kk,uy=ddy*kk;
      if(who==='player'){face=st.dface||(ddy<0?'up':'down');px+=ux;py+=uy;moving=true;footsteps(dt)}else{var a3=actorObj(who);a3.x+=ux;a3.y+=uy}return}
    var useX=Math.abs(ddx)>=2&&(Math.abs(ddx)>=Math.abs(ddy)||Math.abs(ddy)<2),mvx=0,mvy=0;
    if(useX){mvx=Math.sign(ddx)*Math.min(sp,Math.abs(ddx));if(who==='player')face=ddx>0?'right':'left'}
    else{mvy=Math.sign(ddy)*Math.min(sp,Math.abs(ddy));if(who==='player')face=ddy>0?'down':'up'}
    if(who==='player'){px+=mvx;py+=mvy;moving=true;footsteps(dt)}else{var a2=actorObj(who);a2.x+=mvx;a2.y+=mvy}
  }
}
function drawEmotes(dt){

  }
}

  CN='inn1';C=SC.inn1;px=SPAWN.inn1Start.x;py=SPAWN.inn1Start.y;face='up';state='play';tr.a=0;tr.dir=0;tr.after=null;doorO=0;arrival=false;playTheme('inn');

/* ---------- 첫 화면: 불러오기 · 타이틀 · 첫 안내 ---------- */
var LEAVES=[],GUIDEKEY='amelia.guide.v1';
(function(){var i;for(i=0;i<34;i++)LEAVES.push({x:Math.random()*W,y:Math.random()*H,vy:50+Math.random()*70,vx:-20+Math.random()*50,r:Math.random()*6,vr:-2+Math.random()*4,s:.7+Math.random()*.9,c:['#c8541f','#e08a2c','#a63a1a','#d9a03c'][i%4]})})();
var titleT=0;
function drawTitle(){
  var bgi=IMG.title_bg&&IMG.title_bg.complete&&IMG.title_bg.naturalWidth?IMG.title_bg:IMG.bg_plaza;
  var dt=Math.min(.05,(t-(titleT||t))/1000);titleT=t;
  ctx.fillStyle='#0a0814';ctx.fillRect(0,0,W,H);
  if(bgi&&bgi.complete&&bgi.naturalWidth){
    var z=1.06+.03*Math.sin(t/7000),w=W*z,h=H*z;
    ctx.drawImage(bgi,(W-w)/2+Math.sin(t/9000)*18,(H-h)/2,w,h);
  }
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(8,6,20,.7)');g.addColorStop(.35,'rgba(8,6,20,.15)');g.addColorStop(.7,'rgba(8,6,20,.35)');g.addColorStop(1,'rgba(8,6,20,.9)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i,l;
  for(i=0;i<LEAVES.length;i++){l=LEAVES[i];l.y+=l.vy*dt;l.x+=(l.vx+Math.sin(t/900+i)*30)*dt;l.r+=l.vr*dt;
    if(l.y>H+30){l.y=-30;l.x=Math.random()*W}if(l.x>W+30)l.x=-30;if(l.x<-40)l.x=W+20;
    ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.r);ctx.fillStyle=l.c;ctx.fillRect(-9*l.s,-5*l.s,18*l.s,10*l.s);ctx.fillStyle='rgba(255,230,160,.35)';ctx.fillRect(-9*l.s,-1*l.s,18*l.s,2*l.s);ctx.restore()}
  /* 로고 (title_logo 그림이 있으면 그걸 씀) */
  var lg=IMG.title_logo&&IMG.title_logo.complete&&IMG.title_logo.naturalWidth?IMG.title_logo:null;
  var bob=Math.sin(t/1400)*8;
  if(lg){var lw=860,lh=lg.naturalHeight*lw/lg.naturalWidth;ctx.drawImage(lg,(W-lw)/2,420-lh/2+bob,lw,lh)}
  else{
    ctx.textAlign='center';
    ctx.font='60px Galmuri11, sans-serif';ctx.fillStyle='#000';ctx.fillText('마법학교 이야기',W/2+4,344+bob+4);ctx.fillStyle='#f2b24c';ctx.fillText('마법학교 이야기',W/2,344+bob);
    ctx.font='170px Galmuri11, sans-serif';ctx.fillStyle='#000';ctx.fillText('아델라인',W/2+7,520+bob+7);ctx.fillStyle='#f6ead2';ctx.fillText('아델라인',W/2,520+bob);
    ctx.font='34px Galmuri11, sans-serif';ctx.fillStyle='#b9a88a';ctx.fillText('— 빌리지 —',W/2,610+bob);
    ctx.textAlign='start';
  }
  if(state==='title'||state==='boot'){ctx.textAlign='center';ctx.font='26px Galmuri11, sans-serif';ctx.fillStyle='rgba(185,168,138,.8)';ctx.fillText('데모 '+VERSION.split(' ')[0],W/2,H-40);ctx.textAlign='start'}
}
var sbtnEl=document.getElementById('sbtn'),bootEl=document.getElementById('boot'),bootBar=document.getElementById('bbar'),bootP=document.getElementById('bp'),titleEl=document.getElementById('title');
function startBoot(){
  state='boot';try{if(typeof ASSETS!=='undefined'&&ASSETS.title_bg)bootEl.style.backgroundImage='url('+ASSETS.title_bg+')'}catch(e){}
  var keys=Object.keys(IMG),n=keys.length,fin=false;
  function chk(){
    var d=0;keys.forEach(function(k){var im=IMG[k];if(im.complete)d++});
    bootBar.style.width=Math.round(d/n*100)+'%';
    if(d>=n&&!fin){fin=true;
      var go=function(e){window.removeEventListener('pointerdown',go,true);window.removeEventListener('keydown',go,true);audInit();bootEl.classList.add('off');showTitle()};
      setTimeout(function(){bootP.textContent='화면을 터치하세요';bootP.classList.add('on');window.addEventListener('pointerdown',go,true);window.addEventListener('keydown',go,true)},250);return}
    if(!fin)setTimeout(chk,80);
  }
  chk();
}
function showTitle(){
  state='title';clearKeys();path=null;dest=null;pend=null;
  veil.classList.remove('on');veil.classList.remove('fin');dlg.hidden=true;ptEl.hidden=true;
  titleEl.hidden=false;sbtnEl.style.display='none';gbtn.style.display='none';toastEl.classList.remove('on');
  var d=readSave(),c=document.getElementById('tcont');
  c.hidden=!(d&&SC[d.CN]);
  if(!c.hidden){c.textContent='이어하기'}
  var tn=document.getElementById('tnew');tn.textContent='새로 시작';tn.dataset.arm='';
  var ios=/iP(hone|ad|od)/.test(navigator.userAgent)&&!window.navigator.standalone;
  document.getElementById('tfoot').textContent=ios?'사파리 공유 버튼 → "홈 화면에 추가"로 전체 화면 플레이':'';
  playTheme('title');
}
function hideTitle(){titleEl.hidden=true;sbtnEl.style.display='';gbtn.style.display=''}
var GUIDE=[
  ['움직이기','걷기: 화면을 누르면 그곳으로 걸어가요.\n(키보드: 방향키 · WASD)\n\n조사하기: 물건이나 사람을 누르거나,\n아멜리아를 누르면 앞을 살펴봐요.\n(키보드: 스페이스 · Enter · E)'],
  ['시간과 날짜','시간대(아침·낮·저녁·밤)는\n지금 내 기기의 시계와 같이 흘러가요.\n상점은 밤에도 열려 있고, 학교는 밤에 잠겨요.\n\n날짜는 다락방 침대에서 잠들 때만 넘어가요.'],
  ['기록과 저장','오른쪽 위 ! 버튼(키보드 J)은\n일지예요. 퀘스트·가방·마법·인물을 볼 수 있어요.\n\n장소를 옮길 때마다 자동 저장돼요.\n설정은 왼쪽 위 메뉴(Esc)에서 바꿀 수 있어요.']
];
var guideI=0,guideDone=null;
function seenGuide(){try{return !!localStorage.getItem(GUIDEKEY)}catch(e){return false}}
function showGuide(done){
  guideI=0;guideDone=done;document.getElementById('guide').hidden=false;renderGuide();
}
function renderGuide(){
  var g=GUIDE[guideI];
  document.getElementById('gh').textContent=g[0];document.getElementById('gb').textContent=g[1];
  document.getElementById('gp').textContent=(guideI+1)+' / '+GUIDE.length;
  document.getElementById('gnext').textContent=guideI>=GUIDE.length-1?'시작하기':'다음';
}
function endGuide(){
  try{localStorage.setItem(GUIDEKEY,'1')}catch(e){}
  document.getElementById('guide').hidden=true;sfx('confirm');
  var d=guideDone;guideDone=null;if(d)d();
}
document.getElementById('gnext').addEventListener('click',function(){sfx('select');if(guideI>=GUIDE.length-1)endGuide();else{guideI++;renderGuide()}});
document.getElementById('gskip').addEventListener('click',endGuide);
function startNew(){
  hideTitle();veil.classList.remove('on');
  var go=function(){reset()};
  if(!seenGuide())showGuide(go);else go();
}
document.getElementById('tcont').addEventListener('click',function(){sfx('confirm');hideTitle();if(!loadGame())reset()});
document.getElementById('tnew').addEventListener('click',function(){
  var b=this;
  if(hasSave()&&b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='저장이 지워져요 · 한 번 더';sfx('select');setTimeout(function(){if(b.dataset.arm==='1'){b.dataset.arm='';b.textContent='새로 시작'}},3500);return}
  sfx('confirm');startNew();
});
document.getElementById('tset').addEventListener('click',function(){sfx('confirm');openSettings(false)});
document.getElementById('tinfo').addEventListener('click',function(){sfx('confirm');curTab='정보';openSettings(false)});

/* ---------- 입력 ---------- */
function act(){
  if(state==='mini'){miniDown(null);return}
  if(state==='dialog'){
    if(waitChoice){var b=chEl.children[selIdx];if(b)b.click();return}
    advance();return}
  if(state==='play')interact(findTarget());
}
var KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
window.addEventListener('keydown',function(e){
  audInit();
  if(e.code==='KeyJ'&&(state==='play'||(state==='menu'&&jmode))){e.preventDefault();if(state==='menu')closeSettings();else openJournal();return}
  if(e.code==='Escape'){e.preventDefault();if(state==='menu')closeSettings();else openSettings();return}
  if(state==='menu')return;
  if(state==='mini'&&KM[e.code]){e.preventDefault();if(!e.repeat)miniDir(KM[e.code]);return}
  if(state==='dialog'&&waitChoice&&KM[e.code]){
    var d=KM[e.code];if(d==='left'||d==='up')setSel(selIdx-1);else setSel(selIdx+1);e.preventDefault();return}
  if(KM[e.code]){keysK[KM[e.code]]=1;lastAxis=(KM[e.code]==='left'||KM[e.code]==='right')?'h':'v';e.preventDefault();return}
  if(e.code==='Space'||e.code==='Enter'||e.code==='KeyZ'||e.code==='KeyE'){e.preventDefault();if(!e.repeat)act()}
});
window.addEventListener('keyup',function(e){if(KM[e.code])keysK[KM[e.code]]=0;if(state==='mini'&&(e.code==='Space'||e.code==='Enter'||e.code==='KeyZ'||e.code==='KeyE'))miniUp()});
window.addEventListener('blur',clearKeys);

/* 화면을 눌러 이동: 바닥을 누르면 걸어가고, 물건을 누르면 가서 조사, 아멜리아를 누르면 앞을 조사 */
var ptr={down:false,id:null,sx:0,sy:0,obj:null,moved:false,t0:0};
function worldPt(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function objAt(p){
  var i,o,ob=C.objs,best=null,bd=1e9;
  for(i=0;i<ob.length;i++){o=ob[i];
    if(p.x>=o.x-20&&p.x<=o.x+o.w+20&&p.y>=o.y-20&&p.y<=o.y+o.h+20){
      var d=Math.hypot(p.x-(o.x+o.w/2),p.y-(o.y+o.h/2));if(d<bd){bd=d;best=o}}
  }
  return best;
}
cv.addEventListener('pointerdown',function(e){
  if(state==='mini'){e.preventDefault();miniDown(worldPt(e));return}
  if(state==='dialog'){if(!waitChoice)advance();return}
  if(state!=='play')return;
  e.preventDefault();
  var p=worldPt(e);
  ptr.down=true;ptr.id=e.pointerId;ptr.sx=p.x;ptr.sy=p.y;ptr.moved=false;ptr.t0=performance.now();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  /* 아멜리아 자신을 누르면 앞을 조사 */
  var cx=px+HW/2;
  if(Math.abs(p.x-cx)<70&&p.y>py+HH-330*PS&&p.y<py+HH+20){ptr.down=false;path=null;dest=null;pend=null;var o0=findTarget();if(o0)interact(o0);return}
  if(!SET.tapMove){ptr.down=false;return}
  var o=objAt(p);
  if(o){pend=o;path=planPath(p.x,p.y,o);dest=null;if(path&&!path.length)arrive()}
  else{pend=null;setDestFromPoint(p.x,p.y-HH/2+0,null)}
});
cv.addEventListener('pointermove',function(e){
  if(!ptr.down||e.pointerId!==ptr.id||state!=='play')return;
  var p=worldPt(e);
  if(Math.hypot(p.x-ptr.sx,p.y-ptr.sy)>40){ptr.moved=true;pend=null;
    var now=performance.now();if(now-(ptr.last||0)>110){ptr.last=now;setDestFromPoint(p.x,p.y-HH/2,null)}}
});
function pend0(e){if(state==='mini')miniUp();if(ptr.down&&e.pointerId===ptr.id)ptr.down=false}
cv.addEventListener('pointerup',pend0);cv.addEventListener('pointercancel',pend0);
dlg.addEventListener('pointerdown',function(e){if(!waitChoice)advance()});
document.getElementById('stage').addEventListener('contextmenu',function(e){e.preventDefault()});

/* ---------- 크기 / 루프 ---------- */
function resize(){
  var vw=window.innerWidth,vh=window.innerHeight;
  var s=Math.min(vw/W,vh/H);if(s<0.1)s=0.1;
  var w=Math.round(W*s),h=Math.round(H*s);
  cv.style.width=w+'px';cv.style.height=h+'px';
  stage.style.fontSize=Math.max(13,Math.round(w/30*(UIZOOM[SET.textSize]||1)))+'px';
}
window.addEventListener('resize',resize);resize();

var last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;t=now;
  if(now-lastSync>1000){lastSync=now;if(state==='play')syncPhase()}
  update(dt);
  render(state==='play'?findTarget():null);
  requestAnimationFrame(loop);
}
/*DBG*/
loadSettings();applyAll();
if(window.__noTitle){bootEl.classList.add('off');if(hasSave())askContinue();else reset()}else startBoot();
requestAnimationFrame(loop);
})();
</script>
